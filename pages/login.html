<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rockea</title>
    <meta name="author" content="Abel Ruiz, Octavio Caram, Ornella Ricobelli" />
    <meta name="description" content="Una aplicacion de bandas de rock" />
    <meta
      name="keywords"
      content="Musicas, artistas , Rock ,Nirvana, Soda Stereo, Metallica, Kiss"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="shortcut icon" href="../assets/img/guitarra logo favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="css/index.css" />
  </head>

  <body>
  <main>
      <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="w-25">
          <form>
            <h2 class="text-center mb-4">Iniciar sesión</h2>

            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="exampleInputEmail1"
                placeholder="rockea@gmail.com"
                required
              />
            </div>

            <div class="mb-3">
              <label for="exampleInputPassword1" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="exampleInputPassword1"
                placeholder="Introduce tu contraseña"
                required
                minlength="8"
              />
              <div class="form-text">
                La contraseña debe tener mínimo 8 caracteres.
              </div>
            </div>
            <a href="../pages/error-404.html" class="btn btn-primary w-100 text-decoration-none">
              Ingresar
            </a>
          </form>
        </div>
      </div>
    </main>
    
    
  </body>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
</html>
